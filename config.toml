# ============================================================
#  Lektor GTA VI — ustawienia
#  Po zmianie zapisz plik i uruchom lektora ponownie.
# ============================================================

[source]
# Skąd brać obraz:
#   "capture" – karta przechwytująca (Elgato HD60 X) albo wirtualna kamera OBS
#   "screen"  – wycinek monitora (PS Remote Play, gra na PC, podgląd w OBS)
#   "file"    – obrazek albo film z dysku (testy)
type = "capture"

# capture: fragment nazwy urządzenia albo jego numer (lista: lista-urzadzen.bat).
# Gdy kartę trzyma OBS, włącz w OBS „Uruchom wirtualną kamerę” i wpisz "OBS Virtual Camera".
device = "HD60"
width = 1920
height = 1080
# Format obrazu z karty — zmień tylko, gdy obraz jest zepsuty: "NV12", "YUY2" albo "MJPG"
fourcc = ""

# screen: numer monitora (1 = główny)
monitor = 1

# file: ścieżka do obrazka albo filmu
file = ""

[ocr]
# "windows" (wbudowany OCR Windowsa) albo "tesseract" (osobny program)
engine = "windows"
language = "pl"
# Co ile milisekund czytać napisy
interval_ms = 200
# Obróbka obrazu przed OCR:
#   "outline" – jasne litery z ciemną obwódką albo cieniem (typowe napisy w grach) — zalecane
#   "bright"  – same jasne litery, bez sprawdzania obwódki
#   "gray"    – zwykła skala szarości (np. napisy na ciemnym pasku tła)
#   "raw"     – bez obróbki
preprocess = "outline"
# Od jakiej jasności (0–255) piksel to litera. Litery giną → obniż (np. 150); łapie tło → podnieś (np. 190).
brightness = 170
# Jak ciemna (0–255) ma być obwódka wokół liter. Litery giną na jasnym tle → podnieś (np. 140).
outline = 110
# Powiększenie wycinka przed OCR; 0 = automatycznie (x2 do 1080p oraz przy małych literach na ekranie 4K)
upscale = 0

[text]
# Minimalna liczba liter w kwestii
min_letters = 2
# Ile kolejnych zgodnych odczytów, zanim lektor przeczyta kwestię (więcej = pewniej, ale później)
stable_reads = 2
# Przez ile sekund nie czytać ponownie tej samej kwestii
repeat_window_s = 12
# Usuwaj „Imię:” z początku kwestii, jeśli gra je wyświetla
strip_speaker_names = false
# Kwestie pasujące do tych wzorców (regex) są pomijane, np. ["^Naciśnij", "^Wciśnij"]
ignore = []

[replacements]
# Jak lektor ma wymawiać nazwy. Działa też z odmianą: „Jasona” → „Dżejsona”.
# Usuń linię, żeby czytał po swojemu.
"Vice City" = "Wajs Siti"
"Jason" = "Dżejson"

[tts]
# Głos Edge TTS: pl-PL-MarekNeural (męski) albo pl-PL-ZofiaNeural (żeński)
voice = "pl-PL-MarekNeural"
# Tempo bazowe w % (0 = naturalne tempo głosu). Za wolno → podnieś (np. 30), za szybko → obniż (np. 10).
rate = 20
# Gdy lektor nie nadąża, przyspiesza o rate_step % za każdą sekundę spóźnienia ponad catch_up_s,
# najwyżej do rate_max, a po nadrobieniu stopniowo zwalnia. Spóźnienie = ile minie od pojawienia się
# najnowszego napisu, zanim lektor zacznie go czytać. Opóźnienie i tempo każdej kwestii widać w panelu.
rate_step = 15
rate_max = 60
catch_up_s = 1.5
# true = bez pauz na przecinkach (także średnikach, dwukropkach, myślnikach i wielokropkach w środku
# zdania); kropki, pytajniki i wykrzykniki zostają. false = syntezator pauzuje jak wcześniej.
skip_commas = true
# Najdłuższa pauza w środku kwestii w ms (np. między zdaniami); dłuższe są skracane. 0 = bez skracania.
max_pause_ms = 180
# Wysokość głosu w Hz (np. -5 = niżej)
pitch = 0
# Głośność lektora (1.0 = normalnie, najwyżej 2.0)
volume = 1.0
# Wyjście audio: puste = domyślne; albo fragment nazwy, np. "Focusrite" (lista: lista-urzadzen.bat)
output_device = ""
# true = jeden stały strumień audio: kolejne kwestie lecą bez dodatkowej ciszy między nimi.
# Gdy dźwięk trzeszczy, ucina się albo znika, ustaw false (stary sposób odtwarzania).
gapless = true
# Zachowane dla zgodności; zaległe kwestie są zawsze czytane niezależnie od wieku
max_delay_s = 0
# Co lektor powie na starcie (sprawdza głos i dźwięk); puste = nic
greeting = "Lektor gotowy."

[ducking]
# Ściszanie gry, gdy mówi lektor. Działa tylko wtedy, gdy dźwięk gry leci przez PC
# (np. OBS z podsłuchem karty, PS Remote Play, gra na PC). Podaj nazwę procesu.
enabled = false
process = "obs64.exe"
level = 0.35

[hotkeys]
# Globalne skróty (działają w każdej aplikacji), format pynput.
# Unikaj liter, które z prawym Altem dają polskie znaki: a c e l n o s u x z.
enabled = true
pause = "<ctrl>+<alt>+p"
repeat = "<ctrl>+<alt>+r"
skip = "<ctrl>+<alt>+k"
select_region = "<ctrl>+<alt>+w"
preview = "<ctrl>+<alt>+d"
quit = "<ctrl>+<alt>+q"

[debug]
# Okno podglądu: co widzi OCR (to samo robi skrót Ctrl+Alt+D)
preview = false
# Więcej informacji w konsoli (każdy odczyt OCR)
verbose = false
# Zapisuj do folderu debug_samples wycinek, tekst, tekst wysłany do syntezatora i nagranie z Edge
# każdej przeczytanej kwestii. Przebieg pracy (każdy odczyt OCR) jest zawsze w lektor.log.
save_samples = false
